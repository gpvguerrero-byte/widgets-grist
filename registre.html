<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SEC MAIL — Registre</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
:root{
  --bleu:#1F3A5F; --bleu-clair:#E8EEF5; --bleu-txt:#17406B;
  --violet-f:#EFEDFB; --violet-txt:#4A3FA8;
  --vert:#1E6B2C; --vert-f:#E4F3E6;
  --ambre-f:#FFF4DC; --ambre-txt:#7A4D00;
  --rouge-f:#FDECEC; --rouge-txt:#9B2222;
  --texte:#1B2430; --gris:#5A6472; --gris-clair:#8A94A2;
  --bord:#DDE3EA; --fond:#F4F6F9;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:#fff;color:var(--texte);font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;font-size:14px}
button,input,select{font-family:inherit}

.entete{display:flex;align-items:center;gap:10px;padding:13px 18px;background:var(--bleu);color:#fff}
.entete .t{font-size:16px;font-weight:600}
.entete .n{margin-left:auto;font-size:13px;color:#C9DCF0}
.entete .v{font-size:11px;color:#7E9BBD;margin-left:12px}

.alerte{margin:12px 18px;padding:10px 14px;border-radius:8px;background:var(--rouge-f);color:var(--rouge-txt);font-size:13px;line-height:1.5}
.alerte:empty{display:none}

.tuiles{display:flex;gap:12px;flex-wrap:wrap;padding:14px 18px 2px}
.tuile{flex:1;min-width:120px;background:var(--fond);border-radius:10px;padding:11px 14px}
.tuile .l{font-size:12px;color:var(--gris-clair)}
.tuile .c{font-size:24px;font-weight:600;margin-top:2px}
.tuile.v .c{color:var(--vert)}
.tuile.a .c{color:var(--ambre-txt)}

.barre{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:14px 18px;border-bottom:1px solid var(--bord)}
.barre select,.barre input{border:1px solid var(--bord);border-radius:6px;padding:6px 10px;font-size:13px;background:#fff;color:var(--texte)}
.barre input{flex:1;min-width:190px}
.barre .btn{border:1px solid #B9C2CE;background:#fff;color:var(--texte);border-radius:6px;padding:6px 13px;font-size:13px;cursor:pointer}
.barre .btn:hover{background:var(--fond)}

.zone{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-weight:600;font-size:12px;color:var(--gris-clair);padding:9px 12px;border-bottom:1px solid var(--bord);white-space:nowrap;background:#fff}
td{padding:10px 12px;border-bottom:1px solid var(--bord);font-size:13px;vertical-align:top}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--fond)}
tbody tr.on{background:var(--bleu-clair)}
.nw{white-space:nowrap}
.gris{color:var(--gris-clair)}
.vide{padding:24px 18px;font-size:13px;color:var(--gris-clair);line-height:1.6}

.pill{display:inline-block;font-size:12px;border-radius:999px;padding:3px 11px;white-space:nowrap}
.pill.vert-contour{background:#fff;border:1px solid var(--vert);color:var(--vert);padding:2px 10px}
.pill.vert-plein{background:var(--vert);color:#fff}
.pill.ambre{background:var(--ambre-f);color:var(--ambre-txt)}
.pill.gris{background:#ECEFF3;color:#5A6472}
.pill.bleu{background:var(--bleu-clair);color:var(--bleu-txt)}
.pill.violet{background:var(--violet-f);color:var(--violet-txt)}

.detail{border-top:3px solid var(--bleu);background:var(--fond);padding:16px 18px 20px}
.detail h2{margin:0 0 3px;font-size:16px;font-weight:600}
.detail .meta{font-size:12px;color:var(--gris-clair);margin-bottom:14px}
.ligne{display:flex;gap:12px;padding:8px 0;border-top:1px solid var(--bord)}
.ligne .lab{width:108px;flex:none;color:var(--gris);font-size:13px;padding-top:2px}
.ligne .val{flex:1;min-width:0;display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:13px}
.ligne .val .rien{color:var(--gris-clair)}
.message{margin-top:12px;border:1px solid var(--bord);border-left:3px solid var(--bleu);background:#fff;padding:12px 15px}
.message .cap{font-size:12px;color:var(--gris-clair);margin-bottom:6px}
.message .txt{font-size:13px;line-height:1.75;white-space:pre-wrap;word-wrap:break-word}
.pj{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px}
.pj .lab{font-size:13px;color:var(--gris);margin-right:2px}
.pj a{font-size:12px;background:var(--bleu-clair);color:var(--bleu-txt);border-radius:6px;padding:5px 11px;text-decoration:none}
.pj .rien{font-size:13px;color:var(--gris-clair)}

@media (max-width:760px){
  .ligne{display:block}
  .ligne .lab{width:auto;margin-bottom:5px}
}
</style>
</head>
<body>

<div class="entete">
  <span class="t">Registre des SEC MAIL</span>
  <span class="n" id="compte"></span>
  <span class="v">registre v1</span>
</div>

<div class="alerte" id="alerte"></div>
<div class="tuiles" id="tuiles"></div>
<div class="barre" id="barre"></div>
<div class="zone" id="tableau"></div>
<div class="detail" id="detail"></div>

<script>
let toutes = [];
let choisie = null;
let libelles = {};
let fichiers = {};
let jeton = null;
let recuDesDonnees = false;
let dernieres = [];

let fAnnee = "", fBureau = "", fStatut = "", recherche = "";

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;");

function alerte(msg){ $("alerte").innerHTML = msg ? esc(msg) : ""; }

function dateDe(v){
  if (v == null || v === "") return null;
  const d = (typeof v === "number") ? new Date(v*1000) : new Date(v);
  return isNaN(d) ? null : d;
}
function jour(v){
  const d = dateDe(v);
  if (!d) return "";
  const p = n => String(n).padStart(2,"0");
  return p(d.getUTCDate())+"/"+p(d.getUTCMonth()+1)+"/"+d.getUTCFullYear();
}
function annee(v){ const d = dateDe(v); return d ? String(d.getUTCFullYear()) : ""; }

function ids(v){
  if (Array.isArray(v) && v[0] === "L") return v.slice(1);
  if (Array.isArray(v)) return v;
  if ((typeof v === "number" && v) || typeof v === "string" && v) return [v];
  return [];
}
function noms(v, table){
  const t = libelles[table] || {};
  return ids(v).map(x => (typeof x === "string") ? x : t[x]).filter(x => x);
}
function enAttente(st){ return st === "A valider" || st === "À valider"; }
function couleurStatut(st){
  if (st === "Validée") return "vert-contour";
  if (enAttente(st)) return "ambre";
  if (st === "Envoyée" || st === "Publiée") return "vert-plein";
  return "gris";
}

// ---------------------------------------------------------------- filtres
function correspond(r){
  if (fAnnee && annee(r.Date_demande) !== fAnnee) return false;
  if (fBureau && (r.Bureau_txt || "") !== fBureau) return false;
  if (fStatut && (r.Statut || "") !== fStatut) return false;
  if (recherche){
    const t = [r.Objet, r.Numero, r.Bureau_txt, r.Demandeur, r.Message]
      .map(x => String(x == null ? "" : x)).join(" ").toLowerCase();
    if (t.indexOf(recherche.toLowerCase()) === -1) return false;
  }
  return true;
}

function distinct(f){
  const v = [];
  toutes.forEach(r => { const x = f(r); if (x && v.indexOf(x) === -1) v.push(x); });
  return v.sort();
}

function dessineTuiles(){
  const v = toutes.filter(correspond);
  const n = st => v.filter(r => st(r.Statut)).length;
  $("tuiles").innerHTML =
      '<div class="tuile"><div class="l">Demandes affichées</div><div class="c">' + v.length + '</div></div>'
    + '<div class="tuile a"><div class="l">En attente</div><div class="c">' + n(enAttente) + '</div></div>'
    + '<div class="tuile"><div class="l">Validées</div><div class="c">'
      + n(s => s === "Validée") + '</div></div>'
    + '<div class="tuile v"><div class="l">Envoyées</div><div class="c">'
      + n(s => s === "Envoyée" || s === "Publiée") + '</div></div>';
}

function dessineBarre(){
  const opt = (liste, val, vide) =>
    '<option value="">' + esc(vide) + '</option>'
    + liste.map(x => '<option value="' + esc(x) + '"'
        + (x === val ? ' selected' : '') + '>' + esc(x) + '</option>').join("");

  $("barre").innerHTML =
      '<select id="sannee">' + opt(distinct(r => annee(r.Date_demande)), fAnnee, "Toutes les années") + '</select>'
    + '<select id="sbureau">' + opt(distinct(r => r.Bureau_txt), fBureau, "Tous les bureaux") + '</select>'
    + '<select id="sstatut">' + opt(distinct(r => r.Statut), fStatut, "Tous les statuts") + '</select>'
    + '<input id="rech" type="text" placeholder="Rechercher un objet, un numéro, un mot du message…" value="'
      + esc(recherche) + '">'
    + '<button class="btn" id="braz">Tout afficher</button>'
    + '<button class="btn" id="bcsv">Exporter en CSV</button>';

  $("sannee").onchange  = e => { fAnnee = e.target.value;  dessine(); };
  $("sbureau").onchange = e => { fBureau = e.target.value; dessine(); };
  $("sstatut").onchange = e => { fStatut = e.target.value; dessine(); };
  $("braz").onclick = () => { fAnnee = fBureau = fStatut = ""; recherche = ""; dessine(); };
  $("bcsv").onclick = exporteCSV;
  const r = $("rech");
  r.oninput = e => {
    recherche = e.target.value;
    const pos = e.target.selectionStart;
    dessine();
    const nr = $("rech"); nr.focus(); nr.setSelectionRange(pos, pos);
  };
}

// ---------------------------------------------------------------- tableau
function dessineTableau(){
  const v = toutes.filter(correspond);
  $("compte").textContent = recuDesDonnees
    ? toutes.length + (toutes.length > 1 ? " demandes enregistrées" : " demande enregistrée")
    : "";

  if (!recuDesDonnees){ $("tableau").innerHTML = '<div class="vide">Chargement…</div>'; return; }
  if (!v.length){
    $("tableau").innerHTML = '<div class="vide">Aucune demande ne correspond à ces critères.</div>';
    return;
  }

  $("tableau").innerHTML =
    '<table><thead><tr>'
    + '<th>Numéro</th><th>Déposée</th><th>Bureau</th><th>Demandeur</th><th>Objet</th>'
    + '<th>Statut</th><th>Validée</th><th>Envoyée</th><th>PJ</th>'
    + '</tr></thead><tbody>'
    + v.map(r => {
        const nbPJ = ids(r.Pieces_jointes).filter(x => typeof x === "number").length;
        return '<tr class="' + (r.id === choisie ? 'on' : '') + '" data-id="' + r.id + '">'
          + '<td class="nw gris">' + esc(r.Numero || "") + '</td>'
          + '<td class="nw">' + esc(jour(r.Date_demande)) + '</td>'
          + '<td class="nw">' + esc(r.Bureau_txt || "") + '</td>'
          + '<td class="nw">' + esc(r.Demandeur || "") + '</td>'
          + '<td>' + esc(r.Objet || "(sans objet)") + '</td>'
          + '<td><span class="pill ' + couleurStatut(r.Statut) + '">' + esc(r.Statut || "") + '</span></td>'
          + '<td class="nw gris">' + esc(jour(r.Date_validation)) + '</td>'
          + '<td class="nw gris">' + esc(jour(r.Date_envoi)) + '</td>'
          + '<td class="nw gris">' + (nbPJ || "") + '</td>'
          + '</tr>';
      }).join("")
    + '</tbody></table>';

  $("tableau").querySelectorAll("tbody tr").forEach(el => {
    el.onclick = () => {
      const id = Number(el.dataset.id);
      choisie = (choisie === id) ? null : id;
      dessine();
    };
  });
}

// ---------------------------------------------------------------- détail
function dessineDetail(){
  const d = $("detail");
  const r = toutes.find(x => x.id === choisie);
  if (!r){ d.innerHTML = ""; return; }

  const pills = (arr, cls) => arr.length
    ? arr.map(n => '<span class="pill ' + cls + '">' + esc(n) + '</span>').join("")
    : '<span class="rien">—</span>';

  const pj = ids(r.Pieces_jointes).filter(x => typeof x === "number");
  const liensPJ = pj.length
    ? pj.map(i => {
        const nom = fichiers[i] || ("pièce jointe " + i);
        const url = jeton ? jeton.baseUrl + "/attachments/" + i + "/download" : null;
        return url
          ? '<a href="' + esc(url) + '" target="_blank" rel="noopener">⬇ ' + esc(nom) + '</a>'
          : '<span class="rien">' + esc(nom) + '</span>';
      }).join("")
    : '<span class="rien">aucune</span>';

  const diff = [];
  if (r.Mise_en_ligne_sur_le_site_de_la_DSDEN) diff.push("Site de la DSDEN");
  if (r.Diffusion_IPROF) diff.push("IPROF");
  if (r.Diffusion_aux_organisations_syndicales) diff.push("Organisations syndicales");

  const etapes = [];
  if (jour(r.Date_demande))    etapes.push("déposée le " + jour(r.Date_demande));
  if (jour(r.Date_validation)) etapes.push("validée le " + jour(r.Date_validation)
      + (r.Valide_par ? " par " + r.Valide_par : ""));
  if (jour(r.Date_envoi))      etapes.push("envoyée le " + jour(r.Date_envoi));

  d.innerHTML =
    '<h2>' + esc(r.Objet || "(sans objet)") + '</h2>'
    + '<div class="meta">' + esc([r.Numero, r.Bureau_txt, r.Demandeur].filter(Boolean).join(" · ")) + '</div>'
    + '<div class="ligne"><div class="lab">Avancement</div><div class="val">'
      + (etapes.length ? esc(etapes.join(" · ")) : '<span class="rien">—</span>') + '</div></div>'
    + '<div class="ligne"><div class="lab">À</div><div class="val">'
      + pills(noms(r.Destinataires,"Liste_TO"),"bleu") + '</div></div>'
    + '<div class="ligne"><div class="lab">Copie</div><div class="val">'
      + pills(noms(r.Copie,"Liste_COPIE"),"violet") + '</div></div>'
    + '<div class="ligne"><div class="lab">Copie cachée</div><div class="val">'
      + pills(noms(r.Copie_cachee,"Liste_CCI"),"violet") + '</div></div>'
    + (diff.length
        ? '<div class="ligne"><div class="lab">Diffusions</div><div class="val">'
          + pills(diff,"gris") + '</div></div>'
        : '')
    + '<div class="message"><div class="cap">Message envoyé</div>'
      + '<div class="txt">' + esc(r.Mail_a_copier || r.Message || "") + '</div></div>'
    + '<div class="pj"><span class="lab">Pièces jointes</span>' + liensPJ + '</div>';
}

function dessine(){ dessineTuiles(); dessineBarre(); dessineTableau(); dessineDetail(); }

// ---------------------------------------------------------------- export
function exporteCSV(){
  const v = toutes.filter(correspond);
  const colonnes = [
    ["Numero",        r => r.Numero],
    ["Date demande",  r => jour(r.Date_demande)],
    ["Bureau",        r => r.Bureau_txt],
    ["Demandeur",     r => r.Demandeur],
    ["Departement",   r => noms(r.Departement, null).join(", ")],
    ["Objet",         r => r.Objet],
    ["Statut",        r => r.Statut],
    ["Date validation", r => jour(r.Date_validation)],
    ["Valide par",    r => r.Valide_par],
    ["Date envoi",    r => jour(r.Date_envoi)],
    ["Destinataires", r => noms(r.Destinataires,"Liste_TO").join(", ")],
    ["Copie",         r => noms(r.Copie,"Liste_COPIE").join(", ")],
    ["Copie cachee",  r => noms(r.Copie_cachee,"Liste_CCI").join(", ")],
    ["Nb pieces jointes", r => ids(r.Pieces_jointes).filter(x => typeof x === "number").length],
    ["Mise en ligne site", r => r.Mise_en_ligne_sur_le_site_de_la_DSDEN ? "oui" : "non"],
    ["Diffusion IPROF",    r => r.Diffusion_IPROF ? "oui" : "non"],
    ["Diffusion syndicats", r => r.Diffusion_aux_organisations_syndicales ? "oui" : "non"],
    ["Message",       r => r.Mail_a_copier || r.Message]
  ];
  const cellule = x => {
    const s = String(x == null ? "" : x).replace(/"/g, '""');
    return '"' + s + '"';
  };
  const lignes = [colonnes.map(c => cellule(c[0])).join(";")]
    .concat(v.map(r => colonnes.map(c => cellule(c[1](r))).join(";")));

  // le BOM permet à Excel d'ouvrir le fichier avec les accents corrects
  const blob = new Blob(["﻿" + lignes.join("\r\n")],
    { type: "text/csv;charset=utf-8;" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  const n = new Date();
  const p = x => String(x).padStart(2,"0");
  a.download = "registre_sec_mail_" + n.getFullYear() + p(n.getMonth()+1) + p(n.getDate()) + ".csv";
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

// ---------------------------------------------------------------- données
async function chargeReferentiels(){
  for (const t of ["Liste_TO","Liste_COPIE","Liste_CCI"]){
    try {
      const d = await grist.docApi.fetchTable(t);
      const m = {};
      (d.id || []).forEach((rid, k) => { m[rid] = (d.Libelle || [])[k]; });
      libelles[t] = m;
    } catch (e) { libelles[t] = {}; }
  }
  try {
    const d = await grist.docApi.fetchTable("Bureaux");
    const m = {};
    (d.id || []).forEach((rid, k) => { m[rid] = (d.Code || [])[k]; });
    libelles["Bureaux"] = m;
  } catch (e) { libelles["Bureaux"] = {}; }
  try {
    const a = await grist.docApi.fetchTable("_grist_Attachments");
    const m = {};
    (a.id || []).forEach((rid, k) => { m[rid] = (a.fileName || [])[k]; });
    fichiers = m;
  } catch (e) { fichiers = {}; }
  try {
    jeton = await grist.docApi.getAccessToken({ readOnly: true });
  } catch (e) { jeton = null; }
}

function majLignes(recs){
  toutes = (recs || [])
    .map(r => Object.assign({}, r, { Bureau_txt: noms(r.Bureau, "Bureaux").join(", ") }))
    .sort((a, b) => b.id - a.id);
  if (choisie !== null && !toutes.some(r => r.id === choisie)) choisie = null;
  dessine();
}

// ---------------------------------------------------------------- démarrage
// L'ORDRE COMPTE : on s'abonne avant d'annoncer que le widget est prêt.
grist.onRecords(recs => {
  recuDesDonnees = true;
  dernieres = recs || [];
  majLignes(dernieres);
}, { includeColumns: "all", keepEncoded: true });

grist.ready({ requiredAccess: "full" });

(async () => {
  await chargeReferentiels();
  if (recuDesDonnees) majLignes(dernieres);
})();

setTimeout(() => {
  if (!recuDesDonnees){
    alerte("Aucune donnée reçue de Grist. Vérifiez, dans le panneau de droite : la source "
      + "de données (table « Récapitulatif de la demande ») et le niveau d'accès, qui doit "
      + "être « Accès complet au document ».");
  }
}, 6000);

dessine();
</script>

</body>
</html>
