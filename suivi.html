<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SEC MAIL — Suivi des demandes</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
:root{
  --bleu:#1F3A5F; --bleu-clair:#E8EEF5; --bleu-txt:#17406B;
  --violet-f:#EFEDFB; --violet-txt:#4A3FA8;
  --vert-f:#E4F3E6; --vert-txt:#1E6B2C;
  --ambre-f:#FFF4DC; --ambre-txt:#7A4D00; --ambre-bord:#E8C77A;
  --rouge-f:#FDECEC; --rouge-txt:#9B2222; --rouge-bord:#E3A9A9;
  --texte:#1B2430; --gris:#5A6472; --gris-clair:#8A94A2;
  --bord:#DDE3EA; --fond:#F4F6F9;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:#fff;color:var(--texte);font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;font-size:14px}
button,input,textarea{font-family:inherit}

.entete{display:flex;align-items:center;gap:10px;padding:13px 18px;background:var(--bleu);color:#fff}
.entete .t{font-size:16px;font-weight:600}
.entete .n{margin-left:auto;font-size:13px;color:#C9DCF0}

.alerte{margin:12px 18px;padding:10px 14px;border-radius:8px;background:var(--rouge-f);color:var(--rouge-txt);font-size:13px;line-height:1.5}
.alerte:empty{display:none}
.confirme{margin:12px 18px;padding:10px 14px;border-radius:8px;background:var(--vert-f);color:var(--vert-txt);font-size:13px}
.confirme:empty{display:none}

.barre{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 18px;border-bottom:1px solid var(--bord);background:var(--fond)}
.barre .f{border:1px solid var(--bord);background:#fff;color:var(--gris);border-radius:999px;padding:5px 13px;font-size:13px;cursor:pointer}
.barre .f:hover{background:var(--bleu-clair)}
.barre .f.on{background:var(--bleu);color:#fff;border-color:var(--bleu)}
.barre input{margin-left:auto;border:1px solid var(--bord);border-radius:6px;padding:6px 10px;font-size:13px;min-width:200px;background:#fff;color:var(--texte)}

table{width:100%;border-collapse:collapse}
th{text-align:left;font-weight:600;font-size:12px;color:var(--gris-clair);padding:9px 12px;border-bottom:1px solid var(--bord);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--bord);font-size:13px;vertical-align:top}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--fond)}
tbody tr.on{background:var(--bleu-clair)}
.col-num{white-space:nowrap;color:var(--gris)}
.col-obj{min-width:180px}
.col-av{white-space:nowrap;font-size:12px;color:var(--gris-clair);line-height:1.6}
.vide{padding:22px 18px;font-size:13px;color:var(--gris-clair);line-height:1.6}

.pill{display:inline-block;font-size:12px;border-radius:999px;padding:3px 11px;white-space:nowrap}
.pill.vert{background:var(--vert-f);color:var(--vert-txt)}
.pill.vert-contour{background:#fff;border:1px solid var(--vert-txt);color:var(--vert-txt);padding:2px 10px}
.pill.vert-plein{background:var(--vert-txt);color:#fff}
.pill.bleu{background:var(--bleu-clair);color:var(--bleu-txt)}
.pill.violet{background:var(--violet-f);color:var(--violet-txt)}
.pill.ambre{background:var(--ambre-f);color:var(--ambre-txt)}
.pill.gris{background:#ECEFF3;color:#5A6472}
.pill.rouge{background:var(--rouge-f);color:var(--rouge-txt)}
.pill.visa{background:#E4F3E6;color:#1E6B2C}
.statuts{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:6px 0 2px}

.detail{border-top:3px solid var(--bleu);background:var(--fond);padding:16px 18px 20px}
.detail h2{margin:0 0 3px;font-size:16px;font-weight:600}
.detail .meta{font-size:12px;color:var(--gris-clair);margin-bottom:14px}
.ligne{display:flex;gap:12px;padding:8px 0;border-top:1px solid var(--bord)}
.ligne .lab{width:104px;flex:none;color:var(--gris);font-size:13px;padding-top:2px}
.ligne .val{flex:1;min-width:0;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ligne .val .rien{font-size:13px;color:var(--gris-clair)}
.message{margin-top:12px;border:1px solid var(--bord);border-left:3px solid var(--bleu);background:#fff;padding:12px 15px}
.message .cap{font-size:12px;color:var(--gris-clair);margin-bottom:6px}
.message .txt{font-size:13px;line-height:1.75;white-space:pre-wrap;word-wrap:break-word}
.pj{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px}
.pj .lab{font-size:13px;color:var(--gris);margin-right:2px}
.pj a{font-size:12px;background:var(--bleu-clair);color:var(--bleu-txt);border-radius:6px;padding:5px 11px;text-decoration:none}
.pj .rien{font-size:13px;color:var(--gris-clair)}

.corr{margin-top:14px;background:var(--rouge-f);border:1px solid var(--rouge-bord);border-radius:8px;padding:12px 15px}
.corr .t{font-size:13px;font-weight:600;color:var(--rouge-txt);margin-bottom:6px}
.corr .txt{font-size:13px;line-height:1.6;color:var(--rouge-txt);white-space:pre-wrap}
.corr .bas{margin-top:11px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.edit{margin-top:14px;background:#fff;border:1px solid var(--bord);border-left:3px solid var(--bleu);padding:13px 15px}
.edit .t{font-size:13px;font-weight:600;margin-bottom:9px}
.edit label{display:block;font-size:12px;color:var(--gris);margin:9px 0 4px}
.edit input,.edit textarea{width:100%;border:1px solid var(--bord);border-radius:6px;padding:8px 10px;font-size:13px;background:#fff;color:var(--texte)}
.edit textarea{min-height:120px;resize:vertical;line-height:1.6}
.edit .bas{margin-top:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ref{position:relative}
.jetons{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 8px;border:1px solid var(--bord);border-radius:6px;background:#fff;min-height:38px}
.jetons:focus-within{border-color:var(--bleu)}
.jeton{display:inline-flex;align-items:center;gap:6px;background:var(--bleu-clair);color:var(--bleu-txt);border-radius:999px;padding:3px 5px 3px 11px;font-size:12px;white-space:nowrap}
.jeton button{border:none;background:none;color:var(--bleu-txt);cursor:pointer;font-size:14px;line-height:1;padding:0 4px;border-radius:999px}
.jeton button:hover{background:#CFE0F0}
.jetons .saisie{flex:1;min-width:130px;border:none;outline:none;padding:4px 2px;font-size:13px;background:none;color:var(--texte);width:auto}
.liste{position:absolute;left:0;right:0;z-index:20;background:#fff;border:1px solid var(--bord);border-radius:6px;box-shadow:0 6px 18px rgba(27,36,48,.14);max-height:210px;overflow-y:auto;margin-top:3px}
.liste:empty{display:none}
.liste .o{padding:7px 11px;font-size:13px;cursor:pointer}
.liste .o:hover,.liste .o.sur{background:var(--bleu-clair);color:var(--bleu-txt)}
.liste .aucun{padding:7px 11px;font-size:13px;color:var(--gris-clair)}
.btn{border:none;border-radius:8px;padding:8px 16px;font-size:13px;cursor:pointer;background:#fff;color:var(--texte);border:1px solid #B9C2CE}
.btn:hover{background:var(--fond)}
.btn.prim{background:var(--bleu);color:#fff;border-color:var(--bleu)}
.btn.prim:hover{background:#17304F}
.btn[disabled]{opacity:.5;cursor:default}
.aide{font-size:12px;color:var(--gris-clair)}

@media (max-width:760px){
  .ligne{display:block}
  .ligne .lab{width:auto;margin-bottom:5px}
  .col-av{display:none}
}
</style>
</head>
<body>

<div class="entete">
  <span class="t">Suivi des demandes</span>
  <span class="n" id="compte"></span>
  <span style="font-size:11px;color:#7E9BBD;margin-left:12px">suivi v8</span>
</div>

<div class="alerte" id="alerte"></div>
<div class="confirme" id="confirme"></div>

<div class="barre" id="barre"></div>
<div id="tableau"></div>
<div class="detail" id="detail"></div>

<script>
const TABLE = "Recapitulatif_de_la_demande";

const FILTRES = [
  { cle: "tout",      nom: "Toutes" },
  { cle: "attente",   nom: "À valider" },
  { cle: "corriger",  nom: "Correction demandée" },
  { cle: "validee",   nom: "Validées" },
  { cle: "envoyee",   nom: "Envoyées" }
];

let toutes = [];
let filtre = "tout";
let recherche = "";
let choisie = null;
let libelles = {};
let fichiers = {};
let jeton = null;
let recuDesDonnees = false;
let dernieres = [];
let brouillons = {};   // saisies en cours, par identifiant de demande
let options = {};      // {Liste_TO: [{id, lib}], ...} pour les cases à cocher
let inverse = {};      // {Liste_TO: {libellé: id}} pour retrouver un identifiant

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;");

function alerte(msg){ $("alerte").innerHTML = msg ? esc(msg) : ""; }

let minuteurConfirme = null;
function confirme(msg){
  $("confirme").innerHTML = msg ? esc(msg) : "";
  if (minuteurConfirme) clearTimeout(minuteurConfirme);
  if (msg) minuteurConfirme = setTimeout(() => { $("confirme").innerHTML = ""; }, 8000);
}

function jour(v){
  if (v == null || v === "") return "";
  const d = (typeof v === "number") ? new Date(v*1000) : new Date(v);
  if (isNaN(d)) return "";
  const p = n => String(n).padStart(2,"0");
  return p(d.getUTCDate())+"/"+p(d.getUTCMonth()+1)+"/"+d.getUTCFullYear();
}

function ids(v){
  if (Array.isArray(v) && v[0] === "L") return v.slice(1);
  if (Array.isArray(v)) return v;
  if ((typeof v === "number" && v) || typeof v === "string" && v) return [v];
  return [];
}

function noms(v, table){
  const t = libelles[table] || {};
  return ids(v).map(x => (typeof x === "string") ? x : t[x]).filter(x => x);
}

function mailtoDe(v){
  if (!v) return "";
  const i = String(v).indexOf("mailto:");
  return i === -1 ? "" : String(v).slice(i);
}

// Le mail s'ouvre par un vrai lien, et non par window.open() : depuis l'iframe
// du widget, window.open() perdait les destinataires en copie.
function ouvrirMail(url){
  const a = document.createElement("a");
  a.href = url;
  a.target = "_blank";
  a.rel = "noopener";
  a.style.display = "none";
  document.body.appendChild(a);
  a.click();
  setTimeout(() => a.remove(), 0);
}

function enAttente(st){ return st === "A valider" || st === "À valider"; }

// Les visas sont montrés à part du statut : le statut situe la demande dans le
// circuit, les visas disent quel pôle a visé. Le détail de qui et quand est en
// infobulle, pour ne pas charger l'affichage.
function pillsVisa(r){
  const p = [];
  if (r.Vise_RH)
    p.push('<span class="pill visa" title="' + esc(r.Vise_RH_par || "") + '">Visé RH</span>');
  if (r.Vise_paie)
    p.push('<span class="pill visa" title="' + esc(r.Vise_paie_par || "") + '">Visé paie</span>');
  return p.length ? " " + p.join(" ") : "";
}

function couleurStatut(st){
  if (st === "Validée") return "vert-contour";
  if (st === "A valider" || st === "À valider") return "ambre";
  if (st === "Envoyée" || st === "Publiée") return "vert-plein";
  return "gris";
}

function aCorrection(r){
  return enAttente(r.Statut) && (r.Demande_de_correction || "").trim() !== "";
}

// ---------------------------------------------------------------- filtres
function correspond(r){
  if (filtre === "attente"  && !(enAttente(r.Statut) && !aCorrection(r))) return false;
  if (filtre === "corriger" && !aCorrection(r)) return false;
  if (filtre === "validee"  && r.Statut !== "Validée") return false;
  if (filtre === "envoyee"  && !(r.Statut === "Envoyée" || r.Statut === "Publiée")) return false;
  if (recherche){
    const t = (String(r.Objet || "") + " " + String(r.Numero || "") + " "
      + String(r.Bureau_txt || "") + " " + String(r.Demandeur || "")).toLowerCase();
    if (t.indexOf(recherche.toLowerCase()) === -1) return false;
  }
  return true;
}

function dessineBarre(){
  $("barre").innerHTML =
    FILTRES.map(f => {
      const n = toutes.filter(r => {
        const sauve = filtre; filtre = f.cle;
        const ok = correspond(r); filtre = sauve; return ok;
      }).length;
      return '<button class="f' + (filtre === f.cle ? ' on' : '') + '" data-f="' + f.cle + '">'
        + esc(f.nom) + ' (' + n + ')</button>';
    }).join("")
    + '<input id="rech" type="text" placeholder="Rechercher un objet, un numéro…" value="'
      + esc(recherche) + '">';

  $("barre").querySelectorAll(".f").forEach(b => {
    b.onclick = () => { filtre = b.dataset.f; dessine(); };
  });
  const r = $("rech");
  r.oninput = e => {
    recherche = e.target.value;
    const pos = e.target.selectionStart;
    dessine();
    const nr = $("rech"); nr.focus(); nr.setSelectionRange(pos, pos);
  };
}

// ---------------------------------------------------------------- tableau
function dessineTableau(){
  const vues = toutes.filter(correspond);
  $("compte").textContent = recuDesDonnees
    ? toutes.length + (toutes.length > 1 ? " demandes" : " demande")
    : "";

  if (!recuDesDonnees){
    $("tableau").innerHTML = '<div class="vide">Chargement…</div>';
    return;
  }
  if (!vues.length){
    $("tableau").innerHTML = '<div class="vide">Aucune demande ne correspond à ce filtre.</div>';
    return;
  }

  $("tableau").innerHTML =
    '<table><thead><tr>'
    + '<th>Numéro</th><th>Bureau</th><th>Objet</th><th>État</th><th>Avancement</th>'
    + '</tr></thead><tbody>'
    + vues.map(r => {
        const etapes = [];
        if (jour(r.Date_demande))    etapes.push("déposée le " + jour(r.Date_demande));
        if (jour(r.Date_validation)) etapes.push("validée le " + jour(r.Date_validation));
        if (jour(r.Date_envoi))      etapes.push("envoyée le " + jour(r.Date_envoi));
        return '<tr class="' + (r.id === choisie ? 'on' : '') + '" data-id="' + r.id + '">'
          + '<td class="col-num">' + esc(r.Numero || "") + '</td>'
          + '<td class="col-num">' + esc(r.Bureau_txt || "") + '</td>'
          + '<td class="col-obj">' + esc(r.Objet || "(sans objet)") + '</td>'
          + '<td><span class="pill ' + couleurStatut(r.Statut) + '">' + esc(r.Statut || "") + '</span>'
            + pillsVisa(r)
            + (aCorrection(r) ? ' <span class="pill rouge">correction demandée</span>' : '')
          + '</td>'
          + '<td class="col-av">' + esc(etapes.join(" · ")) + '</td>'
          + '</tr>';
      }).join("")
    + '</tbody></table>';

  $("tableau").querySelectorAll("tbody tr").forEach(el => {
    el.onclick = () => {
      const id = Number(el.dataset.id);
      choisie = (choisie === id) ? null : id;
      dessine();
    };
  });
}

// ---------------------------------------------------------------- détail
function dessineDetail(){
  const d = $("detail");
  const r = toutes.find(x => x.id === choisie);
  if (!r){ d.innerHTML = ""; return; }

  const to  = noms(r.Destinataires, "Liste_TO");
  const cc  = noms(r.Copie, "Liste_COPIE");
  const cci = noms(r.Copie_cachee, "Liste_CCI");
  const pills = (arr, cls) => arr.length
    ? arr.map(n => '<span class="pill ' + cls + '">' + esc(n) + '</span>').join("")
    : '<span class="rien">—</span>';

  const pj = ids(r.Pieces_jointes).filter(x => typeof x === "number");
  const liensPJ = pj.length
    ? pj.map(i => {
        const nom = fichiers[i] || ("pièce jointe " + i);
        const url = jeton ? jeton.baseUrl + "/attachments/" + i + "/download" : null;
        return url
          ? '<a href="' + esc(url) + '" target="_blank" rel="noopener">⬇ ' + esc(nom) + '</a>'
          : '<span class="rien">' + esc(nom) + '</span>';
      }).join("")
    : '<span class="rien">aucune</span>';

  const meta = [];
  if (r.Demandeur) meta.push("demandée par " + r.Demandeur);
  if (jour(r.Date_demande)) meta.push("le " + jour(r.Date_demande));
  if (r.Bureau_txt) meta.push(r.Bureau_txt);

  const urlRenvoi = mailtoDe(r.Renvoi_demande);
  const modifiable = enAttente(r.Statut);
  const bo = brouillon(r.id, r);

  d.innerHTML =
    '<h2>' + esc(r.Objet || "(sans objet)") + '</h2>'
    + '<div class="statuts">'
      + '<span class="pill ' + couleurStatut(r.Statut) + '">' + esc(r.Statut || "") + '</span>'
      + pillsVisa(r)
    + '</div>'
    + '<div class="meta">' + esc([r.Numero].concat(meta).filter(Boolean).join(" · ")) + '</div>'

    + (aCorrection(r)
        ? '<div class="corr">'
          + '<div class="t">Une correction est demandée</div>'
          + '<div class="txt">' + esc(r.Demande_de_correction) + '</div>'
          + '<div class="bas"><span class="aide">corrigez l\'objet ou le message ci-dessous, '
          + 'puis enregistrez</span></div>'
          + '</div>'
        : '')

    + (modifiable ? '' :
        '<div class="ligne"><div class="lab">À</div><div class="val">' + pills(to,"bleu") + '</div></div>'
      + '<div class="ligne"><div class="lab">Copie</div><div class="val">' + pills(cc,"violet") + '</div></div>'
      + '<div class="ligne"><div class="lab">Copie cachée</div><div class="val">' + pills(cci,"violet") + '</div></div>')

    + (modifiable
        ? ''
        : '<div class="message"><div class="cap">Message</div>'
          + '<div class="txt">' + esc(r.Mail_a_copier || r.Message || "") + '</div></div>')

    + '<div class="pj"><span class="lab">Pièces jointes</span>' + liensPJ + '</div>'

    + (modifiable
        ? '<div class="edit">'
          + '<div class="t">Modifier la demande</div>'
          + '<label for="eobj">Objet</label>'
          + '<input id="eobj" type="text" value="' + esc(bo.Objet) + '">'
          + '<label>Destinataires</label>'
          + champRef("TO", bo.TO)
          + '<label>Copie</label>'
          + champRef("COPIE", bo.COPIE)
          + '<label>Copie cachée</label>'
          + champRef("CCI", bo.CCI)
          + '<label for="emsg">Message</label>'
          + '<textarea id="emsg">' + esc(bo.Message) + '</textarea>'
          + '<div class="bas">'
            + (urlRenvoi
                ? '<button class="btn prim" id="bmaj1">Enregistrer et signaler la correction</button>'
                  + '<button class="btn" id="bmaj2">Enregistrer seulement</button>'
                : '<button class="btn prim" id="bmaj2">Enregistrer les modifications</button>')
            + '<span class="aide">modifiable tant que la demande n\'est pas validée</span>'
          + '</div>'
          + '</div>'
        : '');

  if (modifiable){
    $("eobj").oninput = e => { brouillon(r.id).Objet = e.target.value; };
    $("emsg").oninput = e => { brouillon(r.id).Message = e.target.value; };
    ["TO","COPIE","CCI"].forEach(cle => brancheRef(r.id, cle));
    const b1 = $("bmaj1");
    const b2 = $("bmaj2");
    if (b1) b1.onclick = () => enregistrer(r.id, b1, true);
    if (b2) b2.onclick = () => enregistrer(r.id, b2, false);
  }

  const b = $("brenvoi");
  if (b) b.onclick = () => {
    ouvrirMail(urlRenvoi);
    confirme("Le mail vient de s'ouvrir. Il ne reste qu'à l'envoyer.");
  };
}

// Les données sont renvoyées par Grist à chaque modification du document, ce qui
// redessine l'écran : on conserve donc la saisie en cours à part.
// Les valeurs arrivent sous forme de libellés : on remonte aux identifiants,
// seuls acceptés en écriture par Grist pour une colonne de référence.
function versIds(v, table){
  const inv = inverse[table] || {};
  return ids(v)
    .map(x => (typeof x === "number") ? x : inv[x])
    .filter(x => typeof x === "number");
}

function brouillon(id, r){
  if (!brouillons[id]){
    brouillons[id] = {
      Objet: (r && r.Objet) || "",
      Message: (r && r.Message) || "",
      TO:    r ? versIds(r.Destinataires, "Liste_TO")   : [],
      COPIE: r ? versIds(r.Copie, "Liste_COPIE")        : [],
      CCI:   r ? versIds(r.Copie_cachee, "Liste_CCI")   : []
    };
  }
  return brouillons[id];
}

const TABLE_DE = { TO: "Liste_TO", COPIE: "Liste_COPIE", CCI: "Liste_CCI" };

function champRef(cle, selection){
  const t = TABLE_DE[cle];
  const opt = options[t] || [];
  const lib = id => (libelles[t] || {})[id] || ("#" + id);
  return '<div class="ref" data-cle="' + cle + '">'
    + '<div class="jetons">'
      + selection.map(id =>
          '<span class="jeton">' + esc(lib(id))
          + '<button type="button" data-ret="' + id + '" aria-label="Retirer">×</button></span>'
        ).join("")
      + '<input class="saisie" type="text" placeholder="'
        + (opt.length ? "Saisir pour ajouter…" : "liste indisponible") + '"'
        + (opt.length ? "" : " disabled") + '>'
    + '</div>'
    + '<div class="liste"></div>'
    + '</div>';
}

// Redessine un seul champ de références, sans toucher au reste de l'écran :
// un redessin complet ferait perdre le focus et la saisie en cours.
function majChamp(idDemande, cle, focus){
  const vieux = document.querySelector('.ref[data-cle="' + cle + '"]');
  if (!vieux) return;
  const bo = brouillon(idDemande);
  const tmp = document.createElement("div");
  tmp.innerHTML = champRef(cle, bo[cle]);
  vieux.replaceWith(tmp.firstChild);
  brancheRef(idDemande, cle);
  if (focus){
    const i = document.querySelector('.ref[data-cle="' + cle + '"] .saisie');
    if (i) i.focus();
  }
}

function brancheRef(idDemande, cle){
  const bloc = document.querySelector('.ref[data-cle="' + cle + '"]');
  if (!bloc) return;
  const t = TABLE_DE[cle];
  const saisie = bloc.querySelector(".saisie");
  const liste = bloc.querySelector(".liste");
  let sur = -1;   // option survolée au clavier

  bloc.querySelectorAll("button[data-ret]").forEach(b => {
    b.onclick = () => {
      const bo = brouillon(idDemande);
      const k = bo[cle].indexOf(Number(b.dataset.ret));
      if (k !== -1) bo[cle].splice(k, 1);
      majChamp(idDemande, cle, false);
    };
  });

  if (!saisie) return;

  function candidats(){
    const bo = brouillon(idDemande);
    const q = (saisie.value || "").trim().toLowerCase();
    return (options[t] || [])
      .filter(o => bo[cle].indexOf(o.id) === -1)
      .filter(o => !q || String(o.lib).toLowerCase().indexOf(q) !== -1)
      .slice(0, 12);
  }

  function affiche(){
    const c = candidats();
    sur = -1;
    if (!c.length){
      liste.innerHTML = (saisie.value || "").trim()
        ? '<div class="aucun">Aucune liste ne correspond.</div>' : "";
    } else {
      liste.innerHTML = c.map((o, k) =>
        '<div class="o" data-k="' + k + '" data-id="' + o.id + '">' + esc(o.lib) + '</div>'
      ).join("");
      liste.querySelectorAll(".o").forEach(el => {
        el.onmousedown = e => { e.preventDefault(); ajoute(Number(el.dataset.id)); };
      });
    }
  }

  function ajoute(id){
    const bo = brouillon(idDemande);
    if (bo[cle].indexOf(id) === -1) bo[cle].push(id);
    saisie.value = "";
    majChamp(idDemande, cle, true);
  }

  saisie.oninput = affiche;
  saisie.onfocus = affiche;
  saisie.onblur = () => { setTimeout(() => { liste.innerHTML = ""; }, 120); };
  saisie.onkeydown = e => {
    const items = liste.querySelectorAll(".o");
    if (e.key === "ArrowDown" || e.key === "ArrowUp"){
      e.preventDefault();
      if (!items.length) return;
      sur = (e.key === "ArrowDown") ? Math.min(sur + 1, items.length - 1) : Math.max(sur - 1, 0);
      items.forEach((el, k) => el.classList.toggle("sur", k === sur));
      items[sur].scrollIntoView({ block: "nearest" });
    } else if (e.key === "Enter"){
      e.preventDefault();
      const el = items[sur === -1 ? 0 : sur];
      if (el) ajoute(Number(el.dataset.id));
    } else if (e.key === "Escape"){
      liste.innerHTML = "";
    } else if (e.key === "Backspace" && !saisie.value){
      const bo = brouillon(idDemande);
      if (bo[cle].length){ bo[cle].pop(); majChamp(idDemande, cle, true); }
    }
  };
}

async function enregistrer(id, bouton, signaler){
  const bo = brouillons[id];
  if (!bo) return;
  const texte = bouton.textContent;
  bouton.disabled = true;
  bouton.textContent = "Enregistrement…";
  try {
    await grist.docApi.applyUserActions([
      ["UpdateRecord", TABLE, id, {
        Objet: bo.Objet,
        Message: bo.Message,
        Destinataires: ["L"].concat(bo.TO),
        Copie: ["L"].concat(bo.COPIE),
        Copie_cachee: ["L"].concat(bo.CCI)
      }]
    ]);
    alerte("");
    delete brouillons[id];
    if (signaler){
      // le lien de signalement est une formule : on relit la ligne pour en
      // récupérer la version calculée avec le texte qui vient d'être enregistré
      const t = await grist.docApi.fetchTable(TABLE);
      const k = (t.id || []).indexOf(id);
      const url = mailtoDe((k !== -1 && t.Renvoi_demande) ? t.Renvoi_demande[k] : "");
      if (url){
        ouvrirMail(url);
        confirme("Modifications enregistrées. Il ne reste qu'à envoyer le mail "
          + "qui vient de s'ouvrir.");
      } else {
        confirme("Modifications enregistrées.");
        alerte("Le mail de signalement n'a pas pu être ouvert. Utilisez le lien "
          + "« Signaler la correction » dans la fiche Grist.");
      }
    } else {
      confirme("Modifications enregistrées.");
    }
  } catch (e) {
    alerte("Les modifications n'ont pas pu être enregistrées ("
      + (e && e.message ? e.message : e) + ").");
  }
  bouton.disabled = false;
  bouton.textContent = texte;
}

function dessine(){ dessineBarre(); dessineTableau(); dessineDetail(); }

// ---------------------------------------------------------------- données
async function chargeReferentiels(){
  for (const t of ["Liste_TO","Liste_COPIE","Liste_CCI"]){
    try {
      const d = await grist.docApi.fetchTable(t);
      const m = {}, inv = {}, opt = [];
      (d.id || []).forEach((rid, k) => {
        const lib = (d.Libelle || [])[k];
        const actif = (d.Actif === undefined) ? true : (d.Actif[k] !== false);
        m[rid] = lib;
        if (lib){
          inv[lib] = rid;
          if (actif) opt.push({ id: rid, lib: lib });
        }
      });
      libelles[t] = m;
      inverse[t] = inv;
      options[t] = opt;
    } catch (e) { libelles[t] = {}; inverse[t] = {}; options[t] = []; }
  }
  try {
    const d = await grist.docApi.fetchTable("Bureaux");
    const m = {};
    (d.id || []).forEach((rid, k) => { m[rid] = (d.Code || [])[k]; });
    libelles["Bureaux"] = m;
  } catch (e) { libelles["Bureaux"] = {}; }
  try {
    const a = await grist.docApi.fetchTable("_grist_Attachments");
    const m = {};
    (a.id || []).forEach((rid, k) => { m[rid] = (a.fileName || [])[k]; });
    fichiers = m;
  } catch (e) { fichiers = {}; }
  try {
    jeton = await grist.docApi.getAccessToken({ readOnly: true });
  } catch (e) { jeton = null; }
}

function majLignes(recs){
  toutes = (recs || [])
    .map(r => Object.assign({}, r, {
      Bureau_txt: noms(r.Bureau, "Bureaux").join(", ")
    }))
    .sort((a, b) => b.id - a.id);   // la plus récente en premier
  if (choisie !== null && !toutes.some(r => r.id === choisie)) choisie = null;
  dessine();
}

// ---------------------------------------------------------------- démarrage
grist.onRecords(recs => {
  recuDesDonnees = true;
  dernieres = recs || [];
  majLignes(dernieres);
}, { includeColumns: "all", keepEncoded: true });

grist.ready({ requiredAccess: "full" });

(async () => {
  await chargeReferentiels();
  if (recuDesDonnees) majLignes(dernieres);
})();

setTimeout(() => {
  if (!recuDesDonnees){
    alerte("Aucune donnée reçue de Grist. Vérifiez, dans le panneau de droite : "
      + "la source de données (table « Récapitulatif de la demande ») et le niveau "
      + "d'accès, qui doit être « Accès complet au document ».");
  }
}, 6000);

dessine();
