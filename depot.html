<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SEC MAIL — Demande enregistrée</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
:root{
  --bleu:#1F3A5F; --bleu-clair:#E8EEF5; --bleu-txt:#17406B;
  --violet-f:#EFEDFB; --violet-txt:#4A3FA8;
  --vert:#1E6B2C; --vert-f:#E4F3E6;
  --ambre-f:#FFF4DC; --ambre-txt:#7A4D00; --ambre-bord:#E8C77A;
  --rouge-f:#FDECEC; --rouge-txt:#9B2222;
  --texte:#1B2430; --gris:#5A6472; --gris-clair:#8A94A2;
  --bord:#DDE3EA; --fond:#F4F6F9;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:#fff;color:var(--texte);font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;font-size:14px}
button{font-family:inherit}

.page{max-width:720px;margin:0 auto;padding:30px 24px 36px}

.coche{width:52px;height:52px;border-radius:50%;background:var(--vert-f);color:var(--vert);
  display:flex;align-items:center;justify-content:center;font-size:28px;line-height:1;margin-bottom:16px}
h1{margin:0 0 6px;font-size:22px;font-weight:600;line-height:1.25}
.sous{margin:0 0 4px;font-size:14px;color:var(--gris);line-height:1.6}
.ref{font-size:13px;color:var(--gris-clair);margin-top:10px}

.etape{margin-top:24px;background:var(--ambre-f);border:1px solid var(--ambre-bord);border-radius:10px;padding:16px 18px}
.etape .t{font-size:15px;font-weight:600;color:var(--ambre-txt);margin-bottom:6px}
.etape .d{font-size:13px;color:var(--ambre-txt);line-height:1.65;margin-bottom:14px}
.btn{border:none;border-radius:8px;padding:12px 22px;font-size:15px;cursor:pointer;background:var(--bleu);color:#fff}
.btn:hover{background:#17304F}
.btn[disabled]{opacity:.5;cursor:default}
.apres{font-size:12px;color:var(--ambre-txt);opacity:.85;margin-top:11px;line-height:1.6}

.recap{margin-top:24px;border:1px solid var(--bord);border-radius:10px;padding:4px 18px 14px}
.recap .t{font-size:12px;color:var(--gris-clair);margin:14px 0 2px}
.ligne{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--bord)}
.ligne:first-of-type{border-top:none}
.ligne .lab{width:108px;flex:none;color:var(--gris);font-size:13px;padding-top:2px}
.ligne .val{flex:1;min-width:0;display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:13px}
.ligne .val .rien{color:var(--gris-clair)}
.pill{display:inline-block;font-size:12px;border-radius:999px;padding:3px 11px;white-space:nowrap}
.pill.bleu{background:var(--bleu-clair);color:var(--bleu-txt)}
.pill.violet{background:var(--violet-f);color:var(--violet-txt)}
.pill.gris{background:#ECEFF3;color:#5A6472}
.msg{white-space:pre-wrap;line-height:1.7;word-wrap:break-word}

.note{margin-top:20px;font-size:13px;color:var(--gris);line-height:1.65}
.attente{padding:34px 24px;font-size:14px;color:var(--gris-clair);text-align:center}
.alerte{margin:0 0 18px;padding:11px 14px;border-radius:8px;background:var(--rouge-f);color:var(--rouge-txt);font-size:13px;line-height:1.5}
.alerte:empty{display:none}
.confirme{margin:0 0 18px;padding:11px 14px;border-radius:8px;background:var(--vert-f);color:var(--vert);font-size:13px}
.confirme:empty{display:none}
.version{position:absolute;top:8px;right:12px;font-size:11px;color:#C3CBD5}
</style>
</head>
<body>

<div class="version">dépôt v1</div>
<div class="page" id="page"><div class="attente">Chargement…</div></div>

<script>
let libelles = {};
let fichiers = {};
let jeton = null;
let courant = null;
let recuDesDonnees = false;

const esc = s => String(s == null ? "" : s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;");

function ids(v){
  if (Array.isArray(v) && v[0] === "L") return v.slice(1);
  if (Array.isArray(v)) return v;
  if ((typeof v === "number" && v) || typeof v === "string" && v) return [v];
  return [];
}

// Grist transmet les Reference List sous forme de libellés.
function noms(v, table){
  const t = libelles[table] || {};
  return ids(v).map(x => (typeof x === "string") ? x : t[x]).filter(x => x);
}

function mailtoDe(v){
  if (!v) return "";
  const i = String(v).indexOf("mailto:");
  return i === -1 ? "" : String(v).slice(i);
}

function dessine(){
  const p = document.getElementById("page");
  if (!courant){
    p.innerHTML = recuDesDonnees
      ? '<div class="attente">Aucune demande à afficher.</div>'
      : '<div class="attente">Chargement…</div>';
    return;
  }
  const r = courant;

  const to  = noms(r.Destinataires, "Liste_TO");
  const cc  = noms(r.Copie, "Liste_COPIE");
  const cci = noms(r.Copie_cachee, "Liste_CCI");
  const pills = (arr, cls) => arr.length
    ? arr.map(n => '<span class="pill ' + cls + '">' + esc(n) + '</span>').join("")
    : '<span class="rien">—</span>';

  const pj = ids(r.Pieces_jointes).filter(x => typeof x === "number");
  const nomsPJ = pj.length
    ? pj.map(i => '<span class="pill gris">' + esc(fichiers[i] || ("pièce jointe " + i)) + '</span>').join("")
    : '<span class="rien">aucune</span>';

  const diff = [];
  if (r.Mise_en_ligne_sur_le_site_de_la_DSDEN) diff.push("Site de la DSDEN");
  if (r.Diffusion_IPROF) diff.push("IPROF");
  if (r.Diffusion_aux_organisations_syndicales) diff.push("Organisations syndicales");

  const url = mailtoDe(r.A);

  p.innerHTML =
    '<div class="alerte" id="alerte"></div>'
    + '<div class="confirme" id="confirme"></div>'

    + '<div class="coche">✓</div>'
    + '<h1>Votre demande est enregistrée</h1>'
    + '<p class="sous">' + esc(r.Objet || "(sans objet)") + '</p>'
    + '<div class="ref">' + esc([r.Numero, r.Bureau_txt].filter(Boolean).join(" · ")) + '</div>'

    + '<div class="etape">'
      + '<div class="t">Il reste une étape</div>'
      + '<div class="d">Votre demande ne sera traitée que lorsque la cheffe de division '
        + 'et le secrétariat en auront été prévenus. Le bouton ci-dessous ouvre le mail, '
        + 'déjà rédigé : il ne vous reste qu\'à l\'envoyer.</div>'
      + (url
          ? '<button class="btn" id="bprev">Prévenir la cheffe de division et le secrétariat</button>'
          : '<button class="btn" disabled>Lien indisponible</button>')
      + '<div class="apres">Sans ce mail, personne ne sait que votre demande existe.</div>'
    + '</div>'

    + '<div class="recap">'
      + '<div class="t">Ce qui a été enregistré</div>'
      + '<div class="ligne"><div class="lab">Destinataires</div><div class="val">' + pills(to,"bleu") + '</div></div>'
      + '<div class="ligne"><div class="lab">Copie</div><div class="val">' + pills(cc,"violet")
        + '<span class="rien">+ copies obligatoires</span></div></div>'
      + '<div class="ligne"><div class="lab">Copie cachée</div><div class="val">' + pills(cci,"violet") + '</div></div>'
      + '<div class="ligne"><div class="lab">Pièces jointes</div><div class="val">' + nomsPJ + '</div></div>'
      + (diff.length
          ? '<div class="ligne"><div class="lab">Diffusions</div><div class="val">' + pills(diff,"gris") + '</div></div>'
          : '')
      + '<div class="ligne"><div class="lab">Message</div><div class="val"><div class="msg">'
        + esc(r.Mail_a_copier || r.Message || "") + '</div></div></div>'
    + '</div>'

    + '<div class="note">Tant que votre demande n\'est pas validée, vous pouvez la corriger '
      + 'depuis la page <strong>Suivi des demandes</strong>.</div>';

  const b = document.getElementById("bprev");
  if (b) b.onclick = () => {
    window.open(url, "_blank");
    document.getElementById("confirme").textContent =
      "Le mail vient de s'ouvrir. Il ne reste qu'à l'envoyer.";
  };
}

// ---------------------------------------------------------------- données
async function chargeReferentiels(){
  for (const t of ["Liste_TO","Liste_COPIE","Liste_CCI"]){
    try {
      const d = await grist.docApi.fetchTable(t);
      const m = {};
      (d.id || []).forEach((rid, k) => { m[rid] = (d.Libelle || [])[k]; });
      libelles[t] = m;
    } catch (e) { libelles[t] = {}; }
  }
  try {
    const d = await grist.docApi.fetchTable("Bureaux");
    const m = {};
    (d.id || []).forEach((rid, k) => { m[rid] = (d.Code || [])[k]; });
    libelles["Bureaux"] = m;
  } catch (e) { libelles["Bureaux"] = {}; }
  try {
    const a = await grist.docApi.fetchTable("_grist_Attachments");
    const m = {};
    (a.id || []).forEach((rid, k) => { m[rid] = (a.fileName || [])[k]; });
    fichiers = m;
  } catch (e) { fichiers = {}; }
  try {
    jeton = await grist.docApi.getAccessToken({ readOnly: true });
  } catch (e) { jeton = null; }
}

function majCourant(r){
  recuDesDonnees = true;
  courant = r ? Object.assign({}, r, {
    Bureau_txt: noms(r.Bureau, "Bureaux").join(", ")
  }) : null;
  dessine();
}

// ---------------------------------------------------------------- démarrage
// L'ORDRE COMPTE : on s'abonne avant d'annoncer que le widget est prêt.
// onRecord (au singulier) suit la ligne sur laquelle le lien de redirection
// du formulaire a positionné le curseur.
grist.onRecord(r => { majCourant(r); }, { includeColumns: "all", keepEncoded: true });

grist.ready({ requiredAccess: "full" });

(async () => {
  await chargeReferentiels();
  if (courant) dessine();
})();

setTimeout(() => {
  if (!recuDesDonnees){
    document.getElementById("page").innerHTML =
      '<div class="attente">Aucune donnée reçue de Grist. Vérifiez, dans le panneau de droite, '
      + 'la source de données et le niveau d\'accès, qui doit être « Accès complet au document ».</div>';
  }
}, 6000);
</script>

</body>
</html>
