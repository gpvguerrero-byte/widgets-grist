<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SEC MAIL — À valider</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
:root{
  --bleu:#1F3A5F; --bleu-clair:#E8EEF5; --bleu-txt:#17406B;
  --violet-f:#EFEDFB; --violet-txt:#4A3FA8;
  --vert:#1E6B2C; --vert-f:#E4F3E6; --vert-txt:#1E6B2C;
  --ambre-f:#FFF4DC; --ambre-txt:#7A4D00; --ambre-bord:#E8C77A;
  --rouge-f:#FDECEC; --rouge-txt:#9B2222; --rouge-bord:#E3A9A9;
  --texte:#1B2430; --gris:#5A6472; --gris-clair:#8A94A2;
  --bord:#DDE3EA; --fond:#F4F6F9;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:#fff;color:var(--texte);font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;font-size:14px}
button,textarea{font-family:inherit}

.entete{display:flex;align-items:center;gap:10px;padding:13px 18px;background:var(--bleu);color:#fff}
.entete .t{font-size:16px;font-weight:600}
.entete .n{margin-left:auto;font-size:13px;color:#C9DCF0}

.alerte{margin:12px 18px;padding:10px 14px;border-radius:8px;background:var(--rouge-f);color:var(--rouge-txt);font-size:13px;line-height:1.5}
.alerte:empty{display:none}
.confirme{margin:12px 18px;padding:10px 14px;border-radius:8px;background:var(--vert-f);color:var(--vert-txt);font-size:13px}
.confirme:empty{display:none}

.corps{display:flex;align-items:stretch;min-height:240px}
.file{width:260px;flex:none;border-right:1px solid var(--bord);background:var(--fond);overflow-y:auto}
.file .item{padding:11px 14px;border-left:3px solid transparent;border-bottom:1px solid var(--bord);cursor:pointer}
.file .item:hover{background:#EDF1F6}
.file .item.on{background:var(--bleu-clair);border-left-color:var(--bleu)}
.file .item .num{font-size:12px;color:var(--gris-clair)}
.file .item.on .num{color:var(--bleu-txt)}
.file .item .obj{font-size:13px;color:var(--gris);margin-top:2px;line-height:1.35}
.file .item.on .obj{color:var(--bleu-txt)}
.file .vide{padding:18px 14px;font-size:13px;color:var(--gris-clair);line-height:1.5}

.detail{flex:1;min-width:0;padding:16px 20px 22px}
.titre{display:flex;align-items:flex-start;gap:12px}
.titre h1{margin:0;font-size:17px;font-weight:600;line-height:1.3;flex:1;min-width:0}
.meta{font-size:12px;color:var(--gris-clair);margin:4px 0 14px}

.pill{display:inline-block;font-size:12px;border-radius:999px;padding:3px 11px;white-space:nowrap}
.pill.vert{background:var(--vert-f);color:var(--vert-txt)}
.pill.vert-contour{background:#fff;border:1px solid var(--vert-txt);color:var(--vert-txt);padding:2px 10px}
.pill.vert-plein{background:var(--vert-txt);color:#fff}
.pill.bleu{background:var(--bleu-clair);color:var(--bleu-txt)}
.pill.violet{background:var(--violet-f);color:var(--violet-txt)}
.pill.ambre{background:var(--ambre-f);color:var(--ambre-txt)}
.pill.gris{background:#ECEFF3;color:#5A6472}
.pill.visa{background:#E4F3E6;color:#1E6B2C}

.ligne{display:flex;gap:12px;padding:9px 0;border-top:1px solid var(--bord)}
.ligne .lab{width:104px;flex:none;color:var(--gris);font-size:13px;padding-top:2px}
.ligne .val{flex:1;min-width:0;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ligne .val .plus{font-size:12px;color:var(--gris-clair)}
.ligne .val .rien{font-size:13px;color:var(--gris-clair)}

.message{margin-top:14px;border:1px solid var(--bord);border-left:3px solid var(--bleu);background:var(--fond);padding:12px 15px}
.message .cap{font-size:12px;color:var(--gris-clair);margin-bottom:6px}
.message .txt{font-size:13px;line-height:1.75;white-space:pre-wrap;word-wrap:break-word}

.pj{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:14px}
.pj .lab{font-size:13px;color:var(--gris);margin-right:2px}
.pj a{font-size:12px;background:var(--bleu-clair);color:var(--bleu-txt);border-radius:6px;padding:5px 11px;text-decoration:none}
.pj a:hover{background:#D9E5F2}
.pj .rien{font-size:13px;color:var(--gris-clair)}

.btn{border:none;border-radius:8px;padding:9px 18px;font-size:14px;cursor:pointer}
.btn.valide{background:var(--vert);color:#fff}
.btn.valide:hover{background:#17541F}
.btn.sec{background:#fff;color:var(--texte);border:1px solid #B9C2CE}
.btn.sec:hover{background:var(--fond)}
.btn[disabled]{opacity:.5;cursor:default}
.aide{font-size:12px;color:var(--gris-clair)}

.decision{margin-top:18px;padding-top:15px;border-top:1px solid var(--bord);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.visa{margin-top:18px;padding-top:15px;border-top:1px solid var(--bord)}
.visa .vcap{font-size:12px;color:var(--gris-clair);margin-bottom:8px}
.visa .vligne{display:flex;gap:12px;align-items:center;padding:5px 0}
.visa .vlab{width:84px;flex:none;font-size:13px;color:var(--gris)}
.visa .vu{font-size:13px;color:var(--vert-txt);font-weight:600}
.visa .aide{margin-top:7px;display:block}
.vise-mini{margin-top:4px;font-size:11px;color:var(--vert-txt)}

.correction{margin-top:16px;background:var(--rouge-f);border:1px solid var(--rouge-bord);border-radius:8px;padding:12px 15px}
.correction .t{font-size:13px;font-weight:600;color:var(--rouge-txt);margin-bottom:8px}
.correction textarea{width:100%;min-height:68px;border:1px solid var(--rouge-bord);border-radius:6px;padding:8px 10px;font-size:13px;resize:vertical;background:#fff;color:var(--texte)}
.correction .bas{margin-top:10px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}

@media (max-width:760px){
  .corps{display:block}
  .file{width:auto;border-right:none;border-bottom:1px solid var(--bord);max-height:190px}
  .ligne{display:block}
  .ligne .lab{width:auto;margin-bottom:5px}
}
</style>
</head>
<body>

<div class="entete">
  <span class="t">À valider</span>
  <span class="n" id="compte"></span>
  <span style="font-size:11px;color:#7E9BBD;margin-left:12px">valider v8</span>
</div>

<div class="alerte" id="alerte"></div>
<div class="confirme" id="confirme"></div>

<div class="corps">
  <div class="file" id="file"></div>
  <div class="detail" id="detail"></div>
</div>

<script>
const TABLE = "Recapitulatif_de_la_demande";
const EN_ATTENTE = ["A valider", "À valider"];

let lignes = [];
let choisie = null;
let libelles = {};
let fichiers = {};
let jeton = null;
let brouillons = {};   // texte de correction saisi, par identifiant de demande

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;");

function alerte(msg){ $("alerte").innerHTML = msg ? esc(msg) : ""; }

let minuteurConfirme = null;
function confirme(msg){
  $("confirme").innerHTML = msg ? esc(msg) : "";
  if (minuteurConfirme) clearTimeout(minuteurConfirme);
  if (msg) minuteurConfirme = setTimeout(() => { $("confirme").innerHTML = ""; }, 8000);
}

function jour(v){
  if (v == null || v === "") return "";
  const d = (typeof v === "number") ? new Date(v*1000) : new Date(v);
  if (isNaN(d)) return "";
  const p = n => String(n).padStart(2,"0");
  return p(d.getUTCDate())+"/"+p(d.getUTCMonth()+1)+"/"+d.getUTCFullYear();
}

function jourDuJourUTC(){
  const n = new Date();
  return Date.UTC(n.getFullYear(), n.getMonth(), n.getDate()) / 1000;
}

function ids(v){
  if (Array.isArray(v) && v[0] === "L") return v.slice(1);
  if (Array.isArray(v)) return v;
  if ((typeof v === "number" && v) || typeof v === "string" && v) return [v];
  return [];
}

// Grist transmet les Reference List sous forme de libellés, pas d'identifiants.
function noms(v, table){
  const t = libelles[table] || {};
  return ids(v)
    .map(x => (typeof x === "string") ? x : t[x])
    .filter(x => x);
}

// Les visas sont montrés à part du statut : le statut situe la demande dans le
// circuit, les visas disent quel pôle a visé. Le détail de qui et quand est en
// infobulle, pour ne pas charger l'affichage.
function pillsVisa(r){
  const p = [];
  if (r.Vise_RH)
    p.push('<span class="pill visa" title="' + esc(r.Vise_RH_par || "") + '">Visé RH</span>');
  if (r.Vise_paie)
    p.push('<span class="pill visa" title="' + esc(r.Vise_paie_par || "") + '">Visé paie</span>');
  return p.length ? " " + p.join(" ") : "";
}

function mailtoDe(v){
  if (!v) return "";
  const i = String(v).indexOf("mailto:");
  return i === -1 ? "" : String(v).slice(i);
}

// Le mail s'ouvre par un vrai lien, et non par window.open() : depuis l'iframe
// du widget, window.open() perdait les destinataires en copie.
function ouvrirMail(url){
  const a = document.createElement("a");
  a.href = url;
  a.target = "_blank";
  a.rel = "noopener";
  a.style.display = "none";
  document.body.appendChild(a);
  a.click();
  setTimeout(() => a.remove(), 0);
}

// ---------------------------------------------------------------- file
function dessineFile(){
  const f = $("file");
  const n = lignes.length;
  $("compte").textContent = n
    ? n + (n > 1 ? " demandes en attente" : " demande en attente")
    : (recuDesDonnees ? "aucune demande en attente" : "");
  if (!n){
    f.innerHTML = recuDesDonnees
      ? '<div class="vide">Aucune demande à valider.<br><br>'
        + 'Les demandes apparaissent ici dès qu\'un bureau en dépose une.</div>'
      : '<div class="vide">Chargement…</div>';
    $("detail").innerHTML = "";
    return;
  }
  f.innerHTML = lignes.map(r =>
    '<div class="item' + (r.id === choisie ? ' on' : '') + '" data-id="' + r.id + '">'
    + '<div class="num">' + esc([r.Numero, r.Bureau_txt, jour(r.Date_demande)]
        .filter(Boolean).join(" · ")) + '</div>'
    + '<div class="obj">' + esc(r.Objet || "(sans objet)") + '</div>'
    + ((r.Vise_RH || r.Vise_paie)
        ? '<div class="vise-mini">✓ visé '
          + [r.Vise_RH ? "RH" : null, r.Vise_paie ? "paie" : null].filter(Boolean).join(" · ")
          + '</div>'
        : '')
    + '</div>'
  ).join("");
  f.querySelectorAll(".item").forEach(el => {
    el.onclick = () => { choisie = Number(el.dataset.id); dessine(); };
  });
}

// ---------------------------------------------------------------- détail
// Un visa par pôle, indépendants l'un de l'autre. Une fois posé, le bouton
// cède la place au nom de qui a visé, ce qui empêche un second visa du même
// pôle.
function blocVisa(titre, pose, par, idBouton){
  return '<div class="vligne">'
    + (pose
        ? '<div class="vlab">' + esc(titre) + '</div>'
          + '<span class="vu">✓ ' + esc(par || "visé") + '</span>'
        : '<button class="btn sec" id="' + idBouton + '">Visa ' + esc(titre) + '</button>')
    + '</div>';
}

// Le mail prévenant la cheffe de division du visa. Il est construit ici et non
// dans une colonne Grist, ce qui évite deux colonnes de plus.
const MAIL_CHEFDIV = "dsden59.dpep-chefdiv@ac-lille.fr";
const PAGE_VALIDATION = "https://grist.numerique.gouv.fr/o/docs/4hQMfgZWDKzf/SEC-MAIL/p/12";

function lienVisa(r, pole){
  const num = r.Numero || "";
  const sujet = "SEC MAIL " + (num ? num + " " : "") + "- visa " + pole;
  const corps = "Bonjour,\n\n"
    + "Le SEC MAIL " + (num ? num + " " : "")
    + "« " + (r.Objet || "sans objet") + " » a été visé par le " + pole + ".\n\n"
    + "Page de validation :\n" + PAGE_VALIDATION + "\n\n"
    + "Cordialement";
  return "mailto:" + MAIL_CHEFDIV
    + "?subject=" + encodeURIComponent(sujet)
    + "&body=" + encodeURIComponent(corps);
}

function dessineDetail(){
  const d = $("detail");
  const r = lignes.find(x => x.id === choisie);
  if (!r){ d.innerHTML = ""; return; }

  const to  = noms(r.Destinataires, "Liste_TO");
  const cc  = noms(r.Copie, "Liste_COPIE");
  const cci = noms(r.Copie_cachee, "Liste_CCI");

  const pills = (arr, cls) => arr.length
    ? arr.map(n => '<span class="pill ' + cls + '">' + esc(n) + '</span>').join("")
    : '<span class="rien">—</span>';

  const pj = ids(r.Pieces_jointes).filter(x => typeof x === "number");
  const liensPJ = pj.length
    ? pj.map(i => {
        const nom = fichiers[i] || ("pièce jointe " + i);
        const url = jeton ? jeton.baseUrl + "/attachments/" + i + "/download" : null;
        return url
          ? '<a href="' + esc(url) + '" target="_blank" rel="noopener">⬇ ' + esc(nom) + '</a>'
          : '<span class="rien">' + esc(nom) + '</span>';
      }).join("")
    : '<span class="rien">aucune</span>';

  const diff = [];
  if (r.Mise_en_ligne_sur_le_site_de_la_DSDEN) diff.push("Site de la DSDEN");
  if (r.Diffusion_IPROF) diff.push("IPROF");
  if (r.Diffusion_aux_organisations_syndicales) diff.push("Organisations syndicales");

  const meta = [];
  if (r.Numero) meta.push(r.Numero);
  if (r.Bureau_txt) meta.push(r.Bureau_txt);
  if (r.Demandeur) meta.push("demandée par " + r.Demandeur);
  if (jour(r.Date_demande)) meta.push("le " + jour(r.Date_demande));

  const texteCorr = (brouillons[r.id] !== undefined)
    ? brouillons[r.id]
    : (r.Demande_de_correction || "");

  d.innerHTML =
    '<div class="titre">'
      + '<h1>' + esc(r.Objet || "(sans objet)") + '</h1>'
      + '<span class="pill ambre">' + esc(r.Statut || "") + '</span>'
      + pillsVisa(r)
    + '</div>'
    + '<div class="meta">' + esc(meta.join(" · ")) + '</div>'

    + '<div class="ligne"><div class="lab">À</div><div class="val">' + pills(to,"bleu") + '</div></div>'
    + '<div class="ligne"><div class="lab">Copie</div><div class="val">' + pills(cc,"violet")
      + '<span class="plus">+ copies obligatoires</span></div></div>'
    + '<div class="ligne"><div class="lab">Copie cachée</div><div class="val">' + pills(cci,"violet") + '</div></div>'
    + '<div class="ligne"><div class="lab">Diffusions</div><div class="val">'
      + (diff.length ? pills(diff,"gris") : '<span class="rien">aucune demandée</span>')
      + '</div></div>'

    + '<div class="message"><div class="cap">Message qui sera envoyé aux destinataires</div>'
      + '<div class="txt">' + esc(r.Mail_a_copier || r.Message || "") + '</div></div>'

    + '<div class="pj"><span class="lab">Pièces jointes</span>' + liensPJ + '</div>'

    + '<div class="visa">'
      + '<div class="vcap">Visas</div>'
      + blocVisa("Pôle RH", r.Vise_RH, r.Vise_RH_par, "bvisaRH")
      + blocVisa("Pôle paie", r.Vise_paie, r.Vise_paie_par, "bvisaPaie")
      + '<div class="aide">le visa ouvre un mail pour la cheffe de division ; '
        + 'il ne conditionne pas la validation</div>'
    + '</div>'

    + '<div class="decision">'
      + '<button class="btn valide" id="bval">Valider la demande</button>'
      + '<span class="aide">elle passera au secrétariat pour envoi</span>'
    + '</div>'

    + '<div class="correction">'
      + '<div class="t">Demander une correction au bureau</div>'
      + '<textarea id="tcorr" placeholder="Ce qui doit être modifié…">' + esc(texteCorr) + '</textarea>'
      + '<div class="bas">'
        + '<button class="btn sec" id="bcorr">Enregistrer et ouvrir le mail</button>'
        + '<span class="aide">la demande reste en attente jusqu\'à correction</span>'
      + '</div>'
    + '</div>';

  $("tcorr").oninput = e => { brouillons[r.id] = e.target.value; };
  const bRH = $("bvisaRH");
  if (bRH) bRH.onclick = () => viser(r.id, bRH, "Vise_RH", "Pôle RH");
  const bPaie = $("bvisaPaie");
  if (bPaie) bPaie.onclick = () => viser(r.id, bPaie, "Vise_paie", "Pôle paie");
  $("bval").onclick = () => valider(r.id, $("bval"));
  $("bcorr").onclick = () => demanderCorrection(r.id, $("bcorr"));
}

function dessine(){ dessineFile(); dessineDetail(); }

// ---------------------------------------------------------------- écriture
// Le widget ne pose que la case Vise : Grist y attache, par deux formules de
// déclenchement, le nom de qui a visé et la date. Le visa est indépendant de
// la validation, qui reste possible sans lui.
async function viser(id, bouton, colonne, pole){
  const r = lignes.find(x => x.id === id);
  bouton.disabled = true;
  bouton.textContent = "…";
  const champs = {};
  champs[colonne] = true;
  try {
    await grist.docApi.applyUserActions([
      ["UpdateRecord", TABLE, id, champs]
    ]);
    alerte("");
    if (r){
      ouvrirMail(lienVisa(r, pole));
      confirme("✓ Visa enregistré. Il ne reste qu'à envoyer le mail "
        + "qui vient de s'ouvrir pour la cheffe de division.");
    } else {
      confirme("✓ Visa enregistré.");
    }
  } catch (e) {
    bouton.disabled = false;
    bouton.textContent = "Visa " + pole;
    alerte("Le visa n'a pas pu être enregistré ("
      + (e && e.message ? e.message : e) + ").");
  }
}

async function valider(id, bouton){
  const r = lignes.find(x => x.id === id);
  const num = r ? (r.Numero || "") : "";
  bouton.disabled = true;
  bouton.textContent = "Enregistrement…";
  try {
    await grist.docApi.applyUserActions([
      ["UpdateRecord", TABLE, id, {
        Statut: "Validée",
        Date_validation: jourDuJourUTC()
      }]
    ]);
    alerte("");
    confirme("✓ " + (num ? num + " — validée" : "Demande validée")
      + ". Elle est maintenant visible par le secrétariat.");
  } catch (e) {
    bouton.disabled = false;
    bouton.textContent = "Valider la demande";
    alerte("La validation n'a pas pu être enregistrée depuis cet écran ("
      + (e && e.message ? e.message : e)
      + "). Modifiez le statut dans la fiche Grist, à côté.");
  }
}

async function demanderCorrection(id, bouton){
  const texte = ($("tcorr").value || "").trim();
  if (!texte){
    alerte("Écrivez d'abord ce qui doit être corrigé.");
    $("tcorr").focus();
    return;
  }
  bouton.disabled = true;
  bouton.textContent = "Enregistrement…";
  try {
    await grist.docApi.applyUserActions([
      ["UpdateRecord", TABLE, id, { Demande_de_correction: texte }]
    ]);
    // Le lien de correction est une formule : on relit la ligne pour récupérer
    // sa version à jour, qui contient maintenant le texte saisi.
    const t = await grist.docApi.fetchTable(TABLE);
    const k = (t.id || []).indexOf(id);
    const lien = (k !== -1 && t.Lien_correction) ? t.Lien_correction[k] : "";
    const url = mailtoDe(lien);
    if (url){
      ouvrirMail(url);
      confirme("La correction est enregistrée. Il ne reste qu'à envoyer le mail "
        + "qui vient de s'ouvrir.");
      alerte("");
    } else {
      confirme("La correction est enregistrée.");
      alerte("Le mail n'a pas pu être ouvert automatiquement. Utilisez le lien "
        + "« Envoyer la demande de correction » dans la fiche Grist.");
    }
    delete brouillons[id];
  } catch (e) {
    alerte("La correction n'a pas pu être enregistrée ("
      + (e && e.message ? e.message : e) + ").");
  }
  bouton.disabled = false;
  bouton.textContent = "Enregistrer et ouvrir le mail";
}

// ---------------------------------------------------------------- données
async function chargeReferentiels(){
  for (const t of ["Liste_TO","Liste_COPIE","Liste_CCI"]){
    try {
      const d = await grist.docApi.fetchTable(t);
      const m = {};
      (d.id || []).forEach((rid, k) => { m[rid] = (d.Libelle || [])[k]; });
      libelles[t] = m;
    } catch (e) { libelles[t] = {}; }
  }
  try {
    const d = await grist.docApi.fetchTable("Bureaux");
    const m = {};
    (d.id || []).forEach((rid, k) => { m[rid] = (d.Code || [])[k]; });
    libelles["Bureaux"] = m;
  } catch (e) { libelles["Bureaux"] = {}; }
  try {
    const a = await grist.docApi.fetchTable("_grist_Attachments");
    const m = {};
    (a.id || []).forEach((rid, k) => { m[rid] = (a.fileName || [])[k]; });
    fichiers = m;
  } catch (e) { fichiers = {}; }
  try {
    jeton = await grist.docApi.getAccessToken({ readOnly: true });
  } catch (e) { jeton = null; }
}

function majLignes(recs){
  const gardees = (recs || []).filter(r => EN_ATTENTE.indexOf(r.Statut) !== -1);
  lignes = gardees.map(r => Object.assign({}, r, {
    Bureau_txt: noms(r.Bureau, "Bureaux").join(", ")
  }));
  if (!lignes.some(r => r.id === choisie)) choisie = lignes.length ? lignes[0].id : null;
  dessine();
}

// ---------------------------------------------------------------- démarrage
let recuDesDonnees = false;
let dernieres = [];

// L'ORDRE COMPTE : on s'abonne AVANT d'annoncer que le widget est prêt,
// sinon les données initiales sont envoyées dans le vide.
grist.onRecords(recs => {
  recuDesDonnees = true;
  dernieres = recs || [];
  majLignes(dernieres);
}, { includeColumns: "all", keepEncoded: true });

grist.ready({ requiredAccess: "full" });

(async () => {
  await chargeReferentiels();
  if (recuDesDonnees) majLignes(dernieres);
})();

setTimeout(() => {
  if (!recuDesDonnees){
    alerte("Aucune donnée reçue de Grist. Vérifiez, dans le panneau de droite : "
      + "la source de données (table « Récapitulatif de la demande ») et le niveau "
      + "d'accès, qui doit être « Accès complet au document ».");
  }
}, 6000);

dessine();
</script>

</body>
</html>
